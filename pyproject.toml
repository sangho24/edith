[project]
name = "edith"
version = "0.1.0"
description = "상호님의 Knowledge Twin (Karpathy LLM Wiki + harness-first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",       # xAI Grok (OpenAI SDK 호환)
    "pydantic>=2.9.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
    "pyright>=1.1.380",
    # F12 VPS relay — pyright가 test_relay.py 분석 시 필요
    "fastapi>=0.115.0",
    "httpx>=0.27.0",       # FastAPI TestClient 의존
]
relay = [
    # 운영용 (VPS에 deploy 시) — 본체엔 불필요
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
mac = [
    # macOS Edith 본체 운영용 — Apple Calendar (EventKit)
    'pyobjc-framework-EventKit>=11.0; sys_platform == "darwin"',
]
google = [
    # Gmail · Calendar API — F2/F3 실제 OAuth flow 시
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.150.0",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["harness", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
