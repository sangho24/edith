<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edith</title>
<style>
  /* ── Glass / depth theme (Dribbble AI-assistant 참고) ── */
  :root {
    --ink: #18201b; --muted: #5d6a62; --muted2: #95a09a;
    --accent: #1f9d5f; --accent-focus: #178a4f; --accent-soft: rgba(31,157,95,.13);
    --glass: rgba(255,255,255,.52); --glass-strong: rgba(255,255,255,.72);
    --glass-line: rgba(255,255,255,.75); --hairline: rgba(20,45,32,.10);
    --shadow: 0 10px 34px rgba(22,45,33,.09);
    --shadow-lg: 0 18px 50px rgba(22,45,33,.13);
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --pill: 9999px;
    --sans: -apple-system, "SF Pro Text", "SF Pro Display", system-ui,
            "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    --green-soft: rgba(31,157,95,.14); --green-ink: #15784a;
    --red-soft: rgba(196,52,28,.13); --red-ink: #b4341c;
    --amber-soft: rgba(154,107,0,.15); --amber-ink: #8a6200;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    color: var(--ink); font: 400 15px/1.5 var(--sans); letter-spacing: -0.2px;
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(155deg, #e9efe9 0%, #f3f4f1 48%, #e6eee9 100%) fixed;
    overflow: hidden;
  }
  /* depth blobs behind the glass */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(540px 420px at 78% -6%, rgba(31,157,95,.20), transparent 60%),
      radial-gradient(620px 520px at 4% 108%, rgba(120,150,135,.18), transparent 62%),
      radial-gradient(480px 360px at 96% 96%, rgba(255,239,99,.12), transparent 60%);
    filter: saturate(115%);
  }
  .glass {
    background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(165%);
    backdrop-filter: blur(22px) saturate(165%);
    border: 1px solid var(--glass-line); box-shadow: var(--shadow);
  }
  .app { display: grid; grid-template-columns: 244px 1fr; height: 100vh; padding: 14px; gap: 14px; }

  /* ── Sidebar ── */
  aside {
    background: var(--glass-strong); -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%); border: 1px solid var(--glass-line);
    box-shadow: var(--shadow); border-radius: var(--r-lg);
    display: flex; flex-direction: column; padding: 18px 13px;
  }
  .brand {
    display: flex; align-items: center; gap: 9px; padding: 4px 8px 16px;
    font: 600 20px/1 var(--sans); letter-spacing: -0.5px;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: var(--pill);
    background: var(--accent); box-shadow: 0 0 10px rgba(31,157,95,.6);
  }
  nav { display: flex; flex-direction: column; gap: 3px; }
  nav a {
    display: flex; align-items: center; gap: 11px; padding: 9px 11px;
    border-radius: var(--r-sm); color: var(--muted); cursor: pointer;
    font-size: 14px; font-weight: 500; user-select: none; transition: all .14s;
  }
  nav a .ic { width: 18px; text-align: center; font-size: 15px; filter: grayscale(.2); }
  nav a:hover { background: rgba(255,255,255,.5); color: var(--ink); }
  nav a.on { background: var(--accent-soft); color: var(--green-ink); }
  nav a.on .ic { filter: none; }
  nav a .badge {
    margin-left: auto; min-width: 19px; height: 19px; padding: 0 6px;
    border-radius: var(--pill); background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 600; display: none; align-items: center;
    justify-content: center; line-height: 19px;
  }
  nav a .badge.show { display: inline-flex; }
  .usage {
    margin-top: auto; background: rgba(255,255,255,.46); border: 1px solid var(--glass-line);
    border-radius: var(--r-md); padding: 13px 14px;
  }
  .usage .lbl { font-size: 11px; color: var(--muted); font-weight: 600; }
  .usage .big { font-size: 23px; font-weight: 700; letter-spacing: -0.6px; margin-top: 2px; }
  .usage .sub { font-size: 12px; color: var(--muted2); margin-top: 1px; }

  /* ── Content ── */
  .content {
    display: flex; flex-direction: column; overflow: hidden;
    border-radius: var(--r-lg); background: rgba(255,255,255,.34);
    border: 1px solid var(--glass-line); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 15px 26px;
    border-bottom: 1px solid var(--hairline);
  }
  .topbar .hi { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .topbar .date { font-size: 13px; color: var(--muted); }
  .topbar .status { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .topbar .status .led { width: 8px; height: 8px; border-radius: var(--pill); background: var(--muted2); }
  .topbar .status .led.ok { background: var(--accent); box-shadow: 0 0 8px rgba(31,157,95,.6); }
  main { flex: 1; overflow-y: auto; padding: 26px; }
  .view { display: none; max-width: 960px; }
  .view.on { display: block; }
  .hero h2 { font: 600 30px/1.1 var(--sans); letter-spacing: -0.7px; }
  .hero p { color: var(--muted); margin-top: 4px; font-size: 15px; }

  /* ── Cards ── */
  .card {
    background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(160%);
    backdrop-filter: blur(20px) saturate(160%); border: 1px solid var(--glass-line);
    box-shadow: var(--shadow); border-radius: var(--r-lg); padding: 18px 20px;
  }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 22px; }
  .stat .k { font-size: 12px; color: var(--muted); font-weight: 600; }
  .stat .v { font: 700 31px/1.1 var(--sans); letter-spacing: -1px; margin-top: 8px; }
  .stat .d { font-size: 12px; color: var(--muted2); margin-top: 4px; min-height: 16px; }
  .stat.act { cursor: pointer; transition: transform .14s, box-shadow .14s; }
  .stat.act:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .stat .v.accent { color: var(--accent); }
  .section-t { font-size: 13px; font-weight: 700; color: var(--muted); margin: 26px 0 10px; }
  .list-row { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 14px; }
  .list-row:last-child { border-bottom: 0; }
  .list-row .badge-time { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 92px; font-weight: 600; }
  .muted { color: var(--muted); }

  /* ── Buttons ── */
  .btn { font: 600 14px/1 var(--sans); border: 1px solid transparent; border-radius: var(--pill); padding: 9px 18px; cursor: pointer; transition: all .14s; }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 16px rgba(31,157,95,.28); }
  .btn-primary:hover { background: var(--accent-focus); }
  .btn-ghost { background: rgba(255,255,255,.55); border-color: var(--glass-line); color: var(--ink); }
  .btn-ghost:hover { background: rgba(255,255,255,.8); }
  .btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
  .reload { font-size: 13px; padding: 7px 14px; margin-bottom: 16px; }

  /* ── Chat ── */
  #view-chat { display: none; max-width: 780px; height: 100%; }
  #view-chat.on { display: flex; flex-direction: column; }
  #log { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .msg { margin-bottom: 16px; display: flex; flex-direction: column; }
  .msg.me { align-items: flex-end; }
  .msg .who { font-size: 11px; color: var(--muted2); margin-bottom: 4px; padding: 0 6px; }
  .msg .body {
    white-space: pre-wrap; max-width: 82%; padding: 12px 16px; border-radius: var(--r-lg);
    line-height: 1.55; background: var(--glass-strong);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1px solid var(--glass-line); box-shadow: var(--shadow);
  }
  .msg.me .body { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 8px 20px rgba(31,157,95,.26); }
  .msg .meta { font-size: 11px; color: var(--muted2); margin-top: 5px; padding: 0 6px; }
  .composer {
    display: flex; gap: 10px; padding: 12px; margin-top: 10px; border-radius: var(--r-lg);
    background: var(--glass-strong); -webkit-backdrop-filter: blur(20px) saturate(170%);
    backdrop-filter: blur(20px) saturate(170%); border: 1px solid var(--glass-line); box-shadow: var(--shadow);
  }
  textarea {
    flex: 1; resize: none; background: transparent; color: var(--ink);
    border: none; padding: 8px 8px; font: inherit; min-height: 30px; max-height: 150px; letter-spacing: -0.2px;
  }
  textarea:focus { outline: none; }
  .composer .btn-primary { padding: 0 22px; align-self: stretch; }
  .hint { font-size: 12px; color: var(--muted2); margin: 8px 6px 0; }

  pre.mono {
    white-space: pre-wrap; background: rgba(255,255,255,.5); border: 1px solid var(--glass-line);
    border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    font: 13px/1.6 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0;
  }

  /* ── Proposal / Approval cards ── */
  .pcard { margin-bottom: 14px; }
  .pcard .hd { display: flex; align-items: baseline; gap: 9px; margin-bottom: 4px; flex-wrap: wrap; }
  .pcard .ttl { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
  .pcard .meta { font-size: 12px; color: var(--muted); }
  .pcard .rationale { font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
  .chip { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: var(--pill); background: var(--red-soft); color: var(--red-ink); }
  .chip.low { background: var(--green-soft); color: var(--green-ink); }
  .chip.mid { background: var(--amber-soft); color: var(--amber-ink); }
  .step { padding: 9px 0; border-top: 1px solid var(--hairline); }
  .step label { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; }
  .step input { margin-top: 3px; accent-color: var(--accent); }
  .step .si { font-weight: 600; font-size: 14px; }
  .step .sd { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .step .cite { font-size: 12px; color: var(--muted2); margin-top: 3px; }
  .acts { display: flex; gap: 9px; margin-top: 14px; }
  .approval-pre {
    white-space: pre-wrap; background: rgba(255,255,255,.5); border: 1px solid var(--glass-line);
    border-radius: var(--r-md); padding: 10px 12px; margin: 8px 0;
    font: 12px/1.5 ui-monospace, Menlo, monospace; letter-spacing: 0;
  }
  .empty { color: var(--muted2); padding: 28px 0; text-align: center; font-size: 14px; }
  .trow { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--hairline); font-size: 13px; }
  .trow:last-child { border-bottom: 0; }
  .trow .tk { font-variant-numeric: tabular-nums; color: var(--accent); min-width: 80px; font-weight: 600; }
  .trow .tt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .tf { font-size: 11px; color: var(--muted2); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(40,70,55,.18); border-radius: 9px; border: 2px solid transparent; background-clip: content-box; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="dot"></span> Edith</div>
    <nav id="nav">
      <a data-view="home" class="on"><span class="ic">🏠</span> 홈</a>
      <a data-view="chat"><span class="ic">💬</span> 대화</a>
      <a data-view="brief"><span class="ic">☀️</span> 브리핑</a>
      <a data-view="proposals"><span class="ic">📋</span> 제안 <span class="badge" id="b-prop"></span></a>
      <a data-view="approvals"><span class="ic">✅</span> 승인 <span class="badge" id="b-appr"></span></a>
      <a data-view="activity"><span class="ic">📈</span> 활동</a>
    </nav>
    <div class="usage">
      <div class="lbl">토큰 사용 (최근)</div>
      <div class="big" id="u-tok">—</div>
      <div class="sub" id="u-runs">집계 중…</div>
    </div>
  </aside>

  <div class="content">
    <div class="topbar">
      <span class="hi" id="greet">안녕하세요</span>
      <span class="date" id="topdate"></span>
      <span class="status"><span class="led" id="led"></span><span id="status">연결 중…</span></span>
    </div>
    <main>
      <section class="view on" id="view-home">
        <div class="hero">
          <h2 id="home-h">좋은 하루예요 ☀️</h2>
          <p id="home-sub">오늘 요약을 불러오는 중…</p>
        </div>
        <div class="grid4" id="stats"></div>
        <div class="section-t">Top 3</div>
        <div class="card" id="top3"><div class="muted">불러오는 중…</div></div>
        <div class="section-t">오늘 일정</div>
        <div class="card" id="agenda"><div class="muted">불러오는 중…</div></div>
      </section>

      <section class="view" id="view-chat">
        <div id="log"></div>
        <div>
          <div class="composer">
            <textarea id="input" placeholder="Edith에게 물어보세요 — 예: 비씨카드 결과 왔어?"></textarea>
            <button class="btn btn-primary" id="send">전송</button>
          </div>
          <div class="hint">Enter 전송 · Shift+Enter 줄바꿈 · 대화 맥락 기억 · 메일 검색·일정 모두 자연어로</div>
        </div>
      </section>

      <section class="view" id="view-brief">
        <button class="btn btn-ghost reload" onclick="loadBrief()">↻ 새로고침</button>
        <pre class="mono" id="brief">불러오는 중…</pre>
      </section>

      <section class="view" id="view-proposals">
        <button class="btn btn-ghost reload" onclick="loadProposals()">↻ 새로고침</button>
        <div id="proposals"></div>
      </section>

      <section class="view" id="view-approvals">
        <button class="btn btn-ghost reload" onclick="loadApprovals()">↻ 새로고침</button>
        <div id="approvals"></div>
      </section>

      <section class="view" id="view-activity">
        <button class="btn btn-ghost reload" onclick="loadTraces()">↻ 새로고침</button>
        <div class="card" id="traces"><div class="muted">불러오는 중…</div></div>
      </section>
    </main>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TOKEN_KEY = "edith_gui_token";

function authHeaders(headers = {}) {
  const out = { ...headers };
  const token = localStorage.getItem(TOKEN_KEY);
  if (token) out["X-Edith-Token"] = token;
  return out;
}

async function authFetch(url, options = {}, retried = false) {
  const opts = { ...options, headers: authHeaders(options.headers || {}) };
  const resp = await fetch(url, opts);
  if (resp.status !== 401 || retried) return resp;
  const token = prompt("Edith GUI 토큰을 입력하세요");
  if (!token) return resp;
  localStorage.setItem(TOKEN_KEY, token);
  return authFetch(url, options, true);
}

let current = "home";
document.querySelectorAll("#nav a").forEach((a) => { a.onclick = () => switchView(a.dataset.view); });
function switchView(v) {
  current = v;
  document.querySelectorAll("#nav a").forEach((x) => x.classList.toggle("on", x.dataset.view === v));
  document.querySelectorAll(".view").forEach((x) => x.classList.toggle("on", x.id === "view-" + v));
  if (v === "home") loadSummary();
  if (v === "brief") loadBrief();
  if (v === "proposals") loadProposals();
  if (v === "approvals") loadApprovals();
  if (v === "activity") loadTraces();
  if (v === "chat") $("#input").focus();
}

async function loadSummary() {
  let d;
  try { d = await (await authFetch("/ui/summary")).json(); }
  catch (e) { $("#home-sub").textContent = "요약 불러오기 실패: " + e; return; }
  if (!d.ok) { $("#home-sub").textContent = "요약 오류: " + (d.error || "?"); return; }
  $("#home-sub").textContent = d.date || ""; $("#topdate").textContent = d.date || "";
  const pr = d.mail_by_priority || {};
  const prTxt = Object.entries(pr).filter(([, v]) => v).map(([k, v]) => `${k} ${v}`).join(" · ") || "분류 없음";
  const cards = [
    { k: "오늘 일정", v: d.events_n, d: d.busy_min ? `${Math.round(d.busy_min / 6) / 10}h` : "없음", view: "brief", accent: false },
    { k: "안읽음 메일", v: d.unread, d: prTxt, view: "chat", accent: false },
    { k: "제안 대기", v: d.proposals, d: d.proposals ? "검토 필요" : "없음", view: "proposals", accent: d.proposals > 0 },
    { k: "승인 대기", v: d.approvals, d: d.approvals ? "실행 대기" : "없음", view: "approvals", accent: d.approvals > 0 },
  ];
  $("#stats").innerHTML = cards.map((c) =>
    `<div class="card stat act" data-go="${c.view}"><div class="k">${esc(c.k)}</div>
       <div class="v ${c.accent ? "accent" : ""}">${esc(c.v)}</div><div class="d">${esc(c.d)}</div></div>`).join("");
  document.querySelectorAll("#stats .stat").forEach((el) => el.onclick = () => switchView(el.dataset.go));
  $("#top3").innerHTML = (d.top3 && d.top3.length)
    ? d.top3.map((t) => `<div class="list-row">${esc(t)}</div>`).join("") : `<div class="muted">오늘 Top 3 없음</div>`;
  const ag = d.events || [];
  $("#agenda").innerHTML = ag.length
    ? ag.map((e) => { const m = String(e).match(/^(\d{2}:\d{2}-\d{2}:\d{2})\s*(.*)$/);
        return `<div class="list-row">${m ? `<span class="badge-time">${esc(m[1])}</span><span>${esc(m[2])}</span>` : esc(e)}</div>`; }).join("")
    : `<div class="muted">오늘 일정 없음</div>`;
  setBadge("#b-prop", d.proposals); setBadge("#b-appr", d.approvals);
}
function setBadge(sel, n) { const el = $(sel); el.textContent = n || ""; el.classList.toggle("show", !!n); }

// ── CHAT (멀티턴 대화 맥락) ──
let convo = [];
const log = $("#log"), input = $("#input"), sendBtn = $("#send");
function addMsg(who, text, meta) {
  const div = document.createElement("div");
  div.className = "msg" + (who === "나" ? " me" : "");
  div.innerHTML = `<div class="who">${esc(who)}</div><div class="body"></div>` + (meta ? `<div class="meta"></div>` : "");
  div.querySelector(".body").textContent = text;
  if (meta) div.querySelector(".meta").textContent = meta;
  log.appendChild(div); div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}
async function send() {
  const q = input.value.trim();
  if (!q) return;
  input.value = ""; addMsg("나", q);
  sendBtn.disabled = true;
  const pending = addMsg("Edith", "…");
  const history = convo.slice(-8);
  try {
    const r = await authFetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q, history }) });
    const d = await r.json();
    const answer = d.ok ? (d.answer || "(응답 없음)") : ("오류: " + (d.error || r.status));
    pending.querySelector(".body").textContent = answer;
    if (d.ok) {
      convo.push({ role: "user", content: q }, { role: "assistant", content: answer });
      pending.querySelector(".body").insertAdjacentHTML("afterend",
        `<div class="meta">steps ${d.steps} · ${d.tokens} tok · ${esc(d.trace_id || "")}</div>`);
    }
    loadUsage();
  } catch (e) { pending.querySelector(".body").textContent = "네트워크 오류: " + e; }
  finally { sendBtn.disabled = false; input.focus(); }
}
sendBtn.onclick = send;
input.addEventListener("keydown", (e) => {
  // 한글 IME 조합 중 Enter는 무시 — 마지막 글자가 다음 입력에 딸려가는 버그 방지.
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault(); send();
  }
});

async function loadBrief() {
  try { const d = await (await authFetch("/ui/brief")).json(); $("#brief").textContent = d.text || "(브리프 없음)"; }
  catch (e) { $("#brief").textContent = "불러오기 실패: " + e; }
}

function riskChip(s) { return s >= 6 ? "chip" : s >= 4 ? "chip mid" : "chip low"; }
async function loadProposals() {
  const el = $("#proposals"); el.innerHTML = "";
  let d;
  try { d = await (await authFetch("/ui/proposals")).json(); }
  catch (e) { el.innerHTML = `<div class="empty">불러오기 실패: ${esc(e)}</div>`; return; }
  if (!d.proposals || !d.proposals.length) { el.innerHTML = `<div class="empty">대기 중인 제안이 없습니다</div>`; return; }
  for (const p of d.proposals) {
    const card = document.createElement("div"); card.className = "card pcard";
    const steps = p.steps.map((s) => {
      const cite = (s.support_refs && s.support_refs.length) ? s.support_refs.join(", ") : "[추론 — 근거 없음]";
      const ext = s.action_type ? ` · ${esc(s.action_type)}` : "";
      return `<div class="step"><label><input type="checkbox" data-idx="${s.idx}" checked>
        <span><span class="si">${s.idx}. ${esc(s.intent)}</span>${ext}
        <span class="${riskChip(s.risk_score)}">risk ${s.risk_score}</span>
        <div class="sd">${esc(s.explanation || "")}${s.expected_outcome ? " → " + esc(s.expected_outcome) : ""}</div>
        <div class="cite">근거: ${esc(cite)}</div></span></label></div>`;
    }).join("");
    card.innerHTML = `<div class="hd"><span class="ttl">📋 ${esc(p.title)}</span>
      <span class="meta">scope ${esc(p.scope)} · ${p.steps.length} step</span></div>
      ${p.rationale ? `<div class="rationale">${esc(p.rationale)}</div>` : ""}<div>${steps}</div>
      <div class="acts"><button class="btn btn-primary">선택 승인</button><button class="btn btn-ghost">거절</button></div>`;
    card.querySelector(".btn-primary").onclick = () => {
      const idxs = [...card.querySelectorAll("input:checked")].map((c) => +c.dataset.idx);
      decideProposal(p.id, "accept", idxs);
    };
    card.querySelector(".btn-ghost").onclick = () => decideProposal(p.id, "reject");
    el.appendChild(card);
  }
}
async function decideProposal(id, decision, accepted_steps) {
  try {
    const body = { id, decision }; if (accepted_steps) body.accepted_steps = accepted_steps;
    const d = await (await authFetch("/ui/proposals/decide", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json();
    if (!d.ok) alert("실패: " + (d.error || "?"));
    else if (decision === "accept") alert(`✓ ${(d.queued_approvals || []).length}개 step이 승인 큐로 — 승인 탭에서 실행하세요.`);
  } catch (e) { alert("네트워크 오류: " + e); }
  loadProposals(); loadSummary();
}

async function loadApprovals() {
  const el = $("#approvals"); el.innerHTML = "";
  let d;
  try { d = await (await authFetch("/ui/approvals")).json(); }
  catch (e) { el.innerHTML = `<div class="empty">불러오기 실패: ${esc(e)}</div>`; return; }
  if (!d.approvals || !d.approvals.length) { el.innerHTML = `<div class="empty">대기 중인 승인 요청이 없습니다</div>`; return; }
  for (const a of d.approvals) {
    const card = document.createElement("div"); card.className = "card pcard";
    card.innerHTML = `<div class="hd"><span class="ttl">${esc(a.action_type)}</span>
      <span class="${riskChip(a.risk_score)}">risk ${a.risk_score}</span>
      <span class="meta">→ ${esc(a.target_system)} · ${a.reversible ? "가역" : "비가역"} · scope ${esc(a.scope || "-")}</span></div>
      <div class="approval-pre"></div>
      <div class="acts"><button class="btn btn-primary">승인 · 실행</button><button class="btn btn-ghost">거절</button></div>`;
    card.querySelector(".approval-pre").textContent = a.preview;
    card.querySelector(".btn-primary").onclick = () => decide(a.id, "yes");
    card.querySelector(".btn-ghost").onclick = () => decide(a.id, "no");
    el.appendChild(card);
  }
}
async function decide(id, decision) {
  try {
    const d = await (await authFetch("/ui/approve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, decision }) })).json();
    if (!d.ok) alert("실패: " + (d.error || "?"));
    else if (decision === "yes" && d.execution)
      alert(d.execution.ok ? "✓ 실행됨 — " + (d.execution.detail || "완료") : "승인됐으나 실행 실패 — " + (d.execution.error || "?"));
  } catch (e) { alert("네트워크 오류: " + e); }
  loadApprovals(); loadSummary();
}

async function loadTraces() {
  const el = $("#traces");
  try {
    const d = await (await authFetch("/ui/traces")).json();
    if (!d.traces || !d.traces.length) { el.innerHTML = `<div class="muted">활동 기록 없음</div>`; return; }
    el.innerHTML = d.traces.map((t) =>
      `<div class="trow"><span class="tk">${t.cost_tokens} tok</span>
       <span class="tt">${esc(t.task || "(no task)")}</span>
       <span class="tf">${esc(t.finalize_reason || "-")} · ${t.n_steps}st${t.n_blocked ? " · " + t.n_blocked + "blk" : ""}</span></div>`).join("");
  } catch (e) { el.innerHTML = `<div class="muted">불러오기 실패: ${esc(e)}</div>`; }
}
async function loadUsage() {
  try {
    const d = await (await authFetch("/ui/traces")).json();
    const ts = d.traces || [];
    $("#u-tok").textContent = ts.reduce((s, t) => s + (t.cost_tokens || 0), 0).toLocaleString();
    $("#u-runs").textContent = `${ts.length} runs`;
  } catch { $("#u-tok").textContent = "—"; }
}

(async () => {
  try {
    const h = await (await authFetch("/health")).json();
    $("#led").classList.toggle("ok", !!h.ok);
    $("#status").textContent = h.ok ? (h.telegram_configured ? "텔레그램 연결됨" : "온라인") : "오프라인";
  } catch { $("#status").textContent = "오프라인"; }
  loadSummary(); loadUsage();
})();
</script>
</body>
</html>
