<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edith</title>
<style>
  :root {
    --bg: #15171c; --panel: #1d2027; --line: #2c303a;
    --fg: #e6e8ec; --dim: #8b909c; --accent: #6ea8fe; --user: #2a3344;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px;
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header .status { font-size: 12px; color: var(--dim); }
  nav { margin-left: auto; display: flex; gap: 4px; }
  nav button {
    background: none; border: 1px solid transparent; color: var(--dim);
    padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 13px;
  }
  nav button.on { color: var(--fg); background: var(--panel); border-color: var(--line); }
  main { flex: 1; overflow-y: auto; padding: 18px; }
  .tab { display: none; max-width: 760px; margin: 0 auto; }
  .tab.on { display: block; }
  .msg { margin-bottom: 14px; }
  .msg .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; }
  .msg .body {
    white-space: pre-wrap; background: var(--panel);
    padding: 10px 13px; border-radius: 9px; border: 1px solid var(--line);
  }
  .msg.me .body { background: var(--user); }
  .msg .meta { font-size: 11px; color: var(--dim); margin-top: 3px; }
  footer { border-top: 1px solid var(--line); padding: 12px 18px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px;
    font: inherit; min-height: 40px; max-height: 140px;
  }
  button.send {
    background: var(--accent); color: #0c1118; border: none; border-radius: 9px;
    padding: 0 18px; font-weight: 600; cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: default; }
  pre.brief, pre.traces {
    white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 14px; font: 13px/1.6 ui-monospace, Menlo, monospace;
  }
  .reload {
    background: none; border: 1px solid var(--line); color: var(--dim);
    padding: 4px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 12px;
  }
  .empty { color: var(--dim); padding: 20px 0; }
</style>
</head>
<body>
<header>
  <h1>☀️ Edith</h1>
  <span class="status" id="status">connecting…</span>
  <nav>
    <button data-tab="chat" class="on">💬 Chat</button>
    <button data-tab="brief">☀️ Brief</button>
    <button data-tab="traces">📊 Traces</button>
  </nav>
</header>

<main>
  <section class="tab on" id="tab-chat">
    <div id="log"></div>
  </section>
  <section class="tab" id="tab-brief">
    <button class="reload" onclick="loadBrief()">↻ 새로고침</button>
    <pre class="brief" id="brief">불러오는 중…</pre>
  </section>
  <section class="tab" id="tab-traces">
    <button class="reload" onclick="loadTraces()">↻ 새로고침</button>
    <pre class="traces" id="traces">불러오는 중…</pre>
  </section>
</main>

<footer>
  <div class="composer">
    <textarea id="input" placeholder="Edith에게 물어보세요 — Enter 전송, Shift+Enter 줄바꿈"></textarea>
    <button class="send" id="send">전송</button>
  </div>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const log = $("#log"), input = $("#input"), sendBtn = $("#send");

function addMsg(who, text, meta) {
  const div = document.createElement("div");
  div.className = "msg" + (who === "나" ? " me" : "");
  div.innerHTML =
    `<div class="who"></div><div class="body"></div>` +
    (meta ? `<div class="meta"></div>` : "");
  div.querySelector(".who").textContent = who;
  div.querySelector(".body").textContent = text;
  if (meta) div.querySelector(".meta").textContent = meta;
  log.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

async function send() {
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  addMsg("나", q);
  sendBtn.disabled = true;
  const pending = addMsg("Edith", "…");
  try {
    const r = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q }),
    });
    const d = await r.json();
    pending.querySelector(".body").textContent =
      d.ok ? (d.answer || "(응답 없음)") : ("오류: " + (d.error || r.status));
    if (d.ok)
      pending.querySelector(".body").insertAdjacentHTML(
        "afterend",
        `<div class="meta">steps ${d.steps} · ${d.tokens} tok · ${d.trace_id || ""}</div>`
      );
  } catch (e) {
    pending.querySelector(".body").textContent = "네트워크 오류: " + e;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.onclick = send;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

document.querySelectorAll("nav button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach((x) => x.classList.remove("on"));
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    $("#tab-" + b.dataset.tab).classList.add("on");
    if (b.dataset.tab === "brief") loadBrief();
    if (b.dataset.tab === "traces") loadTraces();
  };
});

async function loadBrief() {
  const el = $("#brief");
  try {
    const d = await (await fetch("/ui/brief")).json();
    el.textContent = d.text || "(브리프 없음)";
  } catch (e) { el.textContent = "불러오기 실패: " + e; }
}

async function loadTraces() {
  const el = $("#traces");
  try {
    const d = await (await fetch("/ui/traces")).json();
    if (!d.traces || !d.traces.length) { el.textContent = "(trace 없음)"; return; }
    el.textContent = d.traces
      .map((t) =>
        `${t.id} · ${t.scope || "-"} · steps ${t.n_steps} blocked ${t.n_blocked} · ` +
        `${t.cost_tokens}tok · ${t.finalize_reason || "-"}\n   ${t.task || ""}`)
      .join("\n");
  } catch (e) { el.textContent = "불러오기 실패: " + e; }
}

(async () => {
  try {
    const h = await (await fetch("/health")).json();
    $("#status").textContent = h.ok
      ? `home ${h.edith_home}${h.telegram_configured ? " · telegram" : ""}`
      : "unhealthy";
  } catch { $("#status").textContent = "offline"; }
  input.focus();
})();
</script>
</body>
</html>
