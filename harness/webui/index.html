<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edith</title>
<style>
  :root {
    --bg: #15171c; --panel: #1d2027; --line: #2c303a;
    --fg: #e6e8ec; --dim: #8b909c; --accent: #6ea8fe; --user: #2a3344;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px;
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header .status { font-size: 12px; color: var(--dim); }
  nav { margin-left: auto; display: flex; gap: 4px; }
  nav button {
    background: none; border: 1px solid transparent; color: var(--dim);
    padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 13px;
  }
  nav button.on { color: var(--fg); background: var(--panel); border-color: var(--line); }
  main { flex: 1; overflow-y: auto; padding: 18px; }
  .tab { display: none; max-width: 760px; margin: 0 auto; }
  .tab.on { display: block; }
  .msg { margin-bottom: 14px; }
  .msg .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; }
  .msg .body {
    white-space: pre-wrap; background: var(--panel);
    padding: 10px 13px; border-radius: 9px; border: 1px solid var(--line);
  }
  .msg.me .body { background: var(--user); }
  .msg .meta { font-size: 11px; color: var(--dim); margin-top: 3px; }
  footer { border-top: 1px solid var(--line); padding: 12px 18px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px;
    font: inherit; min-height: 40px; max-height: 140px;
  }
  button.send {
    background: var(--accent); color: #0c1118; border: none; border-radius: 9px;
    padding: 0 18px; font-weight: 600; cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: default; }
  pre.brief, pre.traces {
    white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 14px; font: 13px/1.6 ui-monospace, Menlo, monospace;
  }
  .reload {
    background: none; border: 1px solid var(--line); color: var(--dim);
    padding: 4px 10px; border-radius: 7px; cursor: pointer; margin-bottom: 12px;
  }
  .empty { color: var(--dim); padding: 20px 0; }
  .approval {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 12px 14px; margin-bottom: 12px;
  }
  .approval .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .approval .at { font-weight: 600; }
  .approval .risk {
    font-size: 11px; padding: 1px 7px; border-radius: 6px;
    background: #3a2c2c; color: #e8a0a0;
  }
  .approval .risk.low { background: #2c3a2e; color: #9fd6a6; }
  .approval .tgt { font-size: 12px; color: var(--dim); }
  .approval pre {
    white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, monospace;
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
    padding: 9px 11px; margin: 6px 0;
  }
  .approval .acts { display: flex; gap: 8px; }
  .approval button {
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 14px;
    cursor: pointer; font: inherit; font-size: 13px;
  }
  .approval button.yes { background: #2c3a2e; color: #9fd6a6; }
  .approval button.no { background: #3a2c2c; color: #e8a0a0; }
</style>
</head>
<body>
<header>
  <h1>☀️ Edith</h1>
  <span class="status" id="status">connecting…</span>
  <nav>
    <button data-tab="chat" class="on">💬 Chat</button>
    <button data-tab="brief">☀️ Brief</button>
    <button data-tab="proposals">📋 Proposals</button>
    <button data-tab="approvals">✋ Approvals</button>
    <button data-tab="traces">📊 Traces</button>
  </nav>
</header>

<main>
  <section class="tab on" id="tab-chat">
    <div id="log"></div>
  </section>
  <section class="tab" id="tab-brief">
    <button class="reload" onclick="loadBrief()">↻ 새로고침</button>
    <pre class="brief" id="brief">불러오는 중…</pre>
  </section>
  <section class="tab" id="tab-proposals">
    <button class="reload" onclick="loadProposals()">↻ 새로고침</button>
    <div id="proposals"></div>
  </section>
  <section class="tab" id="tab-approvals">
    <button class="reload" onclick="loadApprovals()">↻ 새로고침</button>
    <div id="approvals"></div>
  </section>
  <section class="tab" id="tab-traces">
    <button class="reload" onclick="loadTraces()">↻ 새로고침</button>
    <pre class="traces" id="traces">불러오는 중…</pre>
  </section>
</main>

<footer>
  <div class="composer">
    <textarea id="input" placeholder="Edith에게 물어보세요 — Enter 전송, Shift+Enter 줄바꿈"></textarea>
    <button class="send" id="send">전송</button>
  </div>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const log = $("#log"), input = $("#input"), sendBtn = $("#send");

function addMsg(who, text, meta) {
  const div = document.createElement("div");
  div.className = "msg" + (who === "나" ? " me" : "");
  div.innerHTML =
    `<div class="who"></div><div class="body"></div>` +
    (meta ? `<div class="meta"></div>` : "");
  div.querySelector(".who").textContent = who;
  div.querySelector(".body").textContent = text;
  if (meta) div.querySelector(".meta").textContent = meta;
  log.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

async function send() {
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  addMsg("나", q);
  sendBtn.disabled = true;
  const pending = addMsg("Edith", "…");
  try {
    const r = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q }),
    });
    const d = await r.json();
    pending.querySelector(".body").textContent =
      d.ok ? (d.answer || "(응답 없음)") : ("오류: " + (d.error || r.status));
    if (d.ok)
      pending.querySelector(".body").insertAdjacentHTML(
        "afterend",
        `<div class="meta">steps ${d.steps} · ${d.tokens} tok · ${d.trace_id || ""}</div>`
      );
  } catch (e) {
    pending.querySelector(".body").textContent = "네트워크 오류: " + e;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.onclick = send;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

document.querySelectorAll("nav button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach((x) => x.classList.remove("on"));
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    $("#tab-" + b.dataset.tab).classList.add("on");
    if (b.dataset.tab === "brief") loadBrief();
    if (b.dataset.tab === "traces") loadTraces();
    if (b.dataset.tab === "approvals") loadApprovals();
    if (b.dataset.tab === "proposals") loadProposals();
  };
});

async function loadProposals() {
  const el = $("#proposals");
  el.innerHTML = "";
  let d;
  try {
    d = await (await fetch("/ui/proposals")).json();
  } catch (e) { el.innerHTML = `<div class="empty">불러오기 실패: ${e}</div>`; return; }
  if (!d.proposals || !d.proposals.length) {
    el.innerHTML = `<div class="empty">대기 중인 제안 없음</div>`;
    return;
  }
  for (const p of d.proposals) {
    const card = document.createElement("div");
    card.className = "approval";
    const steps = p.steps.map((s) => {
      const cite = s.support_refs && s.support_refs.length
        ? s.support_refs.join(", ")
        : "[추론 — 근거 없음]";
      const ext = s.action_type ? ` · ${s.action_type}` : "";
      return `<label style="display:block;margin:4px 0;">` +
        `<input type="checkbox" data-idx="${s.idx}" checked> ` +
        `<b>${s.idx}. ${s.intent}</b>${ext} <span class="${s.risk_score>=6?'risk':'risk low'}">risk ${s.risk_score}</span>` +
        `<div class="tgt" style="margin-left:20px;">${s.explanation||""}` +
        (s.expected_outcome?` → ${s.expected_outcome}`:"") +
        `<br>근거: ${cite}</div></label>`;
    }).join("");
    card.innerHTML =
      `<div class="hd"><span class="at"></span>` +
      `<span class="tgt"></span></div><div class="rationale tgt"></div>` +
      `<div class="steps">${steps}</div>` +
      `<div class="acts" style="margin-top:10px;">` +
      `<button class="yes">선택 승인</button><button class="no">거절</button></div>`;
    card.querySelector(".at").textContent = `📋 ${p.title}`;
    card.querySelector(".tgt").textContent = `scope ${p.scope} · ${p.steps.length} step`;
    card.querySelector(".rationale").textContent = p.rationale ? `근거: ${p.rationale}` : "";
    card.querySelector(".yes").onclick = () => {
      const idxs = [...card.querySelectorAll("input:checked")].map((c) => +c.dataset.idx);
      decideProposal(p.id, "accept", idxs);
    };
    card.querySelector(".no").onclick = () => decideProposal(p.id, "reject");
    el.appendChild(card);
  }
}

async function decideProposal(id, decision, accepted_steps) {
  try {
    const body = { id, decision };
    if (accepted_steps) body.accepted_steps = accepted_steps;
    const r = await fetch("/ui/proposals/decide", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!d.ok) alert("실패: " + (d.error || r.status));
    else if (decision === "accept")
      alert(`✓ ${(d.queued_approvals||[]).length}개 step이 승인 큐로 — Approvals 탭에서 실행하세요.`);
  } catch (e) { alert("네트워크 오류: " + e); }
  loadProposals();
}

async function loadBrief() {
  const el = $("#brief");
  try {
    const d = await (await fetch("/ui/brief")).json();
    el.textContent = d.text || "(브리프 없음)";
  } catch (e) { el.textContent = "불러오기 실패: " + e; }
}

async function loadTraces() {
  const el = $("#traces");
  try {
    const d = await (await fetch("/ui/traces")).json();
    if (!d.traces || !d.traces.length) { el.textContent = "(trace 없음)"; return; }
    el.textContent = d.traces
      .map((t) =>
        `${t.id} · ${t.scope || "-"} · steps ${t.n_steps} blocked ${t.n_blocked} · ` +
        `${t.cost_tokens}tok · ${t.finalize_reason || "-"}\n   ${t.task || ""}`)
      .join("\n");
  } catch (e) { el.textContent = "불러오기 실패: " + e; }
}

async function loadApprovals() {
  const el = $("#approvals");
  el.innerHTML = "";
  let d;
  try {
    d = await (await fetch("/ui/approvals")).json();
  } catch (e) { el.innerHTML = `<div class="empty">불러오기 실패: ${e}</div>`; return; }
  if (!d.approvals || !d.approvals.length) {
    el.innerHTML = `<div class="empty">대기 중인 승인 요청 없음</div>`;
    return;
  }
  for (const a of d.approvals) {
    const card = document.createElement("div");
    card.className = "approval";
    const riskClass = a.risk_score <= 4 ? "risk low" : "risk";
    card.innerHTML =
      `<div class="hd"><span class="at"></span>` +
      `<span class="${riskClass}">risk ${a.risk_score}</span>` +
      `<span class="tgt"></span></div><pre></pre>` +
      `<div class="acts"><button class="yes">승인</button>` +
      `<button class="no">거절</button></div>`;
    card.querySelector(".at").textContent = a.action_type;
    card.querySelector(".tgt").textContent =
      `→ ${a.target_system} · ${a.reversible ? "가역" : "비가역"}`;
    card.querySelector("pre").textContent = a.preview;
    card.querySelector(".yes").onclick = () => decide(a.id, "yes");
    card.querySelector(".no").onclick = () => decide(a.id, "no");
    el.appendChild(card);
  }
}

async function decide(id, decision) {
  try {
    const r = await fetch("/ui/approve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, decision }),
    });
    const d = await r.json();
    if (!d.ok) {
      alert("실패: " + (d.error || r.status));
    } else if (decision === "yes" && d.execution) {
      alert(d.execution.ok
        ? "✓ 실행됨 — " + (d.execution.detail || "완료")
        : "승인됐으나 실행 실패 — " + (d.execution.error || "?"));
    }
  } catch (e) { alert("네트워크 오류: " + e); }
  loadApprovals();
}

(async () => {
  try {
    const h = await (await fetch("/health")).json();
    $("#status").textContent = h.ok
      ? `home ${h.edith_home}${h.telegram_configured ? " · telegram" : ""}`
      : "unhealthy";
  } catch { $("#status").textContent = "offline"; }
  input.focus();
})();
</script>
</body>
</html>
